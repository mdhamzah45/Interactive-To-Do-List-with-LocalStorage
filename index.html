<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive to-do list app with add, complete, delete, and localStorage persistence."
    />
    <title>My To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-label="Interactive to-do list">
        <header class="todo-header">
          <p class="eyebrow">Daily focus</p>
          <h1>My To-Do List</h1>
        </header>

        <form id="todo-form" class="todo-form" aria-label="Add a task">
          <label class="sr-only" for="todo-input">Task name</label>
          <input
            id="todo-input"
            type="text"
            maxlength="120"
            placeholder="What needs to be done?"
            autocomplete="off"
          />
          <button type="submit">Add Task</button>
        </form>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty-state">No tasks yet. Add one to get started.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
